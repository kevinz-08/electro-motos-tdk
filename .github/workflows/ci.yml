name: CI

on:
  push:
    branches: [main, 'sprint*', 'hotfix*', 'fix*', 'feat*']
  pull_request:
    branches: [main]

env:
  # Prisma generate reads the schema — it needs DATABASE_URL defined but never connects in CI.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

  # ── Type-check ────────────────────────────────────────────────────────────────
  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type-check
        run: pnpm type-check

  # ── Tests ─────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Test — domain
        run: pnpm --filter @h2r/domain test

      - name: Test — api
        run: pnpm --filter @h2r/api test

  # ── Build validation ──────────────────────────────────────────────────────────
  # Nota: el build completo de Next.js requiere variables de entorno reales
  # (DATABASE_URL válida para SSR, NEXTAUTH_SECRET, etc.) que no están disponibles
  # en CI. La validación del build de producción se delega a Vercel (web) y
  # Cloud Run (api), que tienen acceso a las variables reales.
  #
  # Este job valida únicamente que el build de NestJS (apps/api) no falla,
  # ya que solo necesita compilar TypeScript sin conectarse a ningún servicio.
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    env:
      NODE_ENV: production
      JWT_SECRET: ci-secret-placeholder-32-characters-min
      INTERNAL_API_SECRET: ci-secret-placeholder-32-characters-min
      WOMPI_EVENTS_SECRET: ci-placeholder
      WOMPI_INTEGRITY_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build API
        run: pnpm --filter @h2r/api build

  # ── Deploy to Cloud Run (solo en push a main) ─────────────────────────────
  deploy:
    name: Deploy → Cloud Run
    runs-on: ubuntu-latest
    needs: [build-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Permisos para Workload Identity Federation (sin JSON keys)
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/electro-motos/api
      SERVICE_NAME: electro-motos-api

    steps:
      - uses: actions/checkout@v4

      # Autentica con GCP via Workload Identity Federation (sin credenciales JSON)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Configura Docker para subir a Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # Build de la imagen Docker desde la raíz del monorepo
      - name: Build Docker image
        run: |
          docker build \
            --file apps/api/Dockerfile \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      - name: Push image to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Despliega la nueva imagen en Cloud Run
      # - Los secretos se inyectan desde GCP Secret Manager como variables de entorno.
      # - Los plain env vars se declaran aquí (no en Secret Manager) y se actualizan
      #   con --update-env-vars para PRESERVAR cualquier variable extra que se haya
      #   añadido manualmente a la revisión (ej: experimentos, A/B testing).
      #   `--set-env-vars` sería destructivo y borraría todas las plain vars
      #   no listadas — una sola omisión podría apagar Wompi prod o Vendelo
      #   silenciosamente. NUNCA usar --set-env-vars en este job.
      # - Delimitador `^|^`: usamos pipe como separador entre pares clave=valor
      #   porque VENDELO_STORE_ADDRESS contiene comas (no podemos usar `,`) y
      #   RESEND_FROM_EMAIL contiene `@` (no podemos usar `@`). El pipe nunca
      #   aparece en estos valores. gcloud soporta cualquier char con `^X^`.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3001 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 60 \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,INTERNAL_API_SECRET=INTERNAL_API_SECRET:latest,WOMPI_PUBLIC_KEY=WOMPI_PUBLIC_KEY:latest,WOMPI_PRIVATE_KEY=WOMPI_PRIVATE_KEY:latest,WOMPI_EVENTS_SECRET=WOMPI_EVENTS_SECRET:latest,WOMPI_INTEGRITY_SECRET=WOMPI_INTEGRITY_SECRET:latest,VENDELO_API_KEY=VENDELO_API_KEY:latest,VENDELO_WEBHOOK_SECRET=VENDELO_WEBHOOK_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME:latest,CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest,CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest,SENTRY_DSN=SENTRY_DSN:latest" \
            --update-env-vars="^|^NODE_ENV=production|FRONTEND_URL=${{ secrets.FRONTEND_URL }}|WOMPI_ENV=production|RESEND_FROM_EMAIL=no-reply@tiendah2r.com|VENDELO_API_URL=https://api.venndelo.com|VENDELO_STORE_NAME=Electro Motos TDK|VENDELO_STORE_PHONE=3152926609|VENDELO_STORE_ADDRESS=Carrera 21 21-58, Bucaramanga. 68001, Santander, Colombia|VENDELO_STORE_CITY_CODE=68001000|VENDELO_STORE_SUBDIVISION_CODE=68|VENDELO_DEFAULT_WEIGHT_KG=1|VENDELO_DEFAULT_HEIGHT_CM=25|VENDELO_DEFAULT_WIDTH_CM=25|VENDELO_DEFAULT_LENGTH_CM=10|VENDELO_WALLET_ALERT_THRESHOLD=50000|VENDELO_POLL_ENABLED=true|VENDELO_POLL_INTERVAL_MS=300000|VENDELO_POLL_BATCH_SIZE=50|VENDELO_POLL_REQUEST_DELAY_MS=100"

      - name: Show service URL
        run: gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.GCP_REGION }} --format 'value(status.url)'
