[build]
builder = "nixpacks"
buildCommand = "NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @h2r/database generate && pnpm --filter @h2r/api build"

[deploy]
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
